spring.application.name=sports
spring.jpa.hibernate.ddl-auto=validate

# Local default only; any real environment sets its own profile and gets no seed data.
spring.profiles.active=dev

# Override per environment, e.g. APP_CORS_ALLOWED_ORIGINS=https://app.example.com
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Observability. Only these three are reachable over HTTP; env, beans, configprops, threaddump and
# friends stay closed because they expose configuration and internals. ActuatorExposureTest pins it.
# Metrics are collected in memory only: adding micrometer-registry-prometheus would add a
# /actuator/prometheus scrape endpoint, without which the numbers reset on every restart.
management.endpoints.web.exposure.include=health,info,metrics
# Component detail names the database and disk paths, so it stays off. Set to "always" per
# environment (or "when-authorized" once the endpoints are behind auth) if you need the breakdown.
management.endpoint.health.show-details=never

